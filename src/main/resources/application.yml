server:
  port: 8080
spring:
  application:
    name: EcoVerse_be
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/eco_verse_db}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

