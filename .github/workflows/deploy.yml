name: "\U0001F680 Build & Deploy EcoVerse BE"

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: epxrlab/ecoverse_be

jobs:
  # ═══════════════════════════════════════════
  # Job 1: Build & Push Docker Image
  # ═══════════════════════════════════════════
  build:
    name: "\U0001F3D7️ Build Docker Image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F511 Login to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "\U0001F3F7️ Extract metadata"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: "\U0001F433 Build and push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ═══════════════════════════════════════════
  # Job 2: Deploy to VPS
  # ═══════════════════════════════════════════
  deploy:
    name: "\U0001F680 Deploy to VPS"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: "\U0001F4E1 Deploy via SSH"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ~/ecoverse

            echo "🔄 Pulling latest image..."
            docker pull ghcr.io/epxrlab/ecoverse_be:latest

            echo "⏹️ Stopping old app container..."
            docker compose -f docker-compose.app.yml down

            echo "🚀 Starting new app container..."
            docker compose -f docker-compose.app.yml up -d

            echo "🧹 Cleaning old images..."
            docker image prune -f

            echo "✅ Deploy completed at $(date)"
